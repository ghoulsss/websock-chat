services:
  webchat:
    container_name: webchat
    restart: always
    build:
      context: ./backend/src
    working_dir: /websocket-chat/backend/src
    command: sh -c "
      alembic upgrade head &&
      python main.py
      "
    env_file: ./src/.env
    networks:
      - webchat-network
    environment:
      - SERVER_PORT=${SERVER_PORT}
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    depends_on:
      - webchat-db

  webchat-db:
    image: postgres:15
    container_name: webchat-db
    restart: always
    command: -p ${POSTGRES_PORT}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_PORT=${POSTGRES_HOST}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    networks:
      - webchat-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - ${POSTGRES_PORT}
    healthcheck:
      test: pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 60s
      timeout: 3s
      retries: 3

  frontend:
    container_name: webchat-frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173" # Vite dev server
      - "4173:4173" # Vite preview server
    volumes:
      - ./frontend:/app # монтируем код для hot-reload
      - /app/node_modules # сохраняем node_modules в контейнере
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - CHOKIDAR_USEPOLLING=true # для hot-reload в Docker
      - WATCHPACK_POLLING=true # дополнительно для webpack/vite
    networks:
      - webchat-network
    depends_on:
      - webchat
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

networks:
  webchat-network:
    name: webchat
    external: true
